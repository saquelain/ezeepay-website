<svg xmlns="http://www.w3.org/2000/svg" width="200" height="60" viewBox="0 0 200 60" role="img" aria-label="Get it on Google Play">
  <defs>
    <linearGradient id="gpBlue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00C4FF"/>
      <stop offset="1" stop-color="#0064F0"/>
    </linearGradient>
    <linearGradient id="gpGreen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00E88C"/>
      <stop offset="1" stop-color="#00B252"/>
    </linearGradient>
    <linearGradient id="gpYellow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFDA00"/>
      <stop offset="1" stop-color="#FF9500"/>
    </linearGradient>
    <linearGradient id="gpRed" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF4E5B"/>
      <stop offset="1" stop-color="#C31162"/>
    </linearGradient>
  </defs>

  <!-- Badge background -->
  <rect x="0.5" y="0.5" width="199" height="59" rx="10" fill="#000000" stroke="#5F5F5F" stroke-width="1"/>

