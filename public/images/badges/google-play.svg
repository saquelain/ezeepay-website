    <path d="M2 1.6 L21.5 13.2 L2 24.8 Q1 25.4 1 24 L1 2.4 Q1 1 2 1.6 Z" fill="none"/>
    <path d="M1.2 0.9 Q0.6 1.3 0.6 2.3 L0.6 33.7 Q0.6 34.7 1.2 35.1 L17.2 18 Z" fill="url(#gpBlue)"/>
    <path d="M1.2 0.9 L17.2 18 L23.6 11.2 L4.1 0.4 Q2.2 -0.6 1.2 0.9 Z" fill="url(#gpGreen)"/>
    <path d="M23.6 11.2 L17.2 18 L23.6 24.8 L30.2 21.2 Q32.4 20 30.2 18.8 L23.6 11.2 Z" fill="url(#gpYellow)"/>
    <path d="M1.2 35.1 Q2.2 36.6 4.1 35.6 L23.6 24.8 L17.2 18 Z" fill="url(#gpRed)"/>
  </g>

  <!-- Text -->
  <text x="58" y="24" font-family="Arial, Helvetica, sans-serif" font-size="11" letter-spacing="0.5" fill="#FFFFFF">GET IT ON</text>
  <text x="58" y="46" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="600" fill="#FFFFFF">Google Play</text>
